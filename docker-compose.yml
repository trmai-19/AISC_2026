services:
  # 1. CƠ SỞ DỮ LIỆU POSTGRESQL 16 + PGVECTOR
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aisc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: aisc_db
    ports:
      - "5432:5432"
    volumes:
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/02_mock_data.sql:/docker-entrypoint-initdb.d/02_mock_data.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aisc_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FASTAPI BACKEND SERVER (RAG COPILOT & REST API)
  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: aisc_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@postgres:5432/aisc_db
      - APP_ENV=development
      - APP_PORT=8000
      - APP_HOST=0.0.0.0
      - CORS_ORIGINS=["*"]
      - EMBEDDING_MODEL=multilingual-e5-small
      - CONFIDENCE_THRESHOLD=0.80
      - ANALYTICS_DATABASE_URL=postgresql+psycopg2://aisc_data:aisc_data_local_2026@postgres_transformed:5432/aisc_data
      - TRANSFORMED_DATABASE_URL=postgresql+psycopg2://aisc_data:aisc_data_local_2026@postgres_transformed:5432/aisc_data
      - EMBEDDING_SERVICE_URL=http://embedding:8000
    volumes:
      # Ánh xạ thư mục mã nguồn để kích hoạt tính năng Hot-Reload khi sửa code
      - ./src/backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      postgres_transformed:
        condition: service_healthy
      embedding:
        condition: service_healthy

  # 3. WEB FRONTEND NGINX (WEB UI CỤC BỘ)
  frontend:
    image: nginx:alpine
    container_name: aisc_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      # Ánh xạ giao diện tĩnh để cập nhật tức thời khi sửa HTML/CSS/JS
      - ./src/ui:/usr/share/nginx/html:ro
    depends_on:
      - backend
  
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: aisc_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: aisc_admin
      MINIO_ROOT_PASSWORD: aisc_minio_local_2026
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
  data_pipeline:
    build: ./data_pipeline
    profiles: ["tools"]
    environment:
      SOURCE_DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/aisc_db
      TRANSFORMED_DATABASE_URL: postgresql://aisc_data:aisc_data_local_2026@postgres_transformed:5432/aisc_data
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: aisc_admin
      AWS_SECRET_ACCESS_KEY: aisc_minio_local_2026
      AWS_DEFAULT_REGION: us-east-1
      RAW_BUCKET: aisc-raw
    volumes:
      - ./data_pipeline:/app
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      postgres_transformed:
        condition: service_healthy
  postgres_transformed:
    image: pgvector/pgvector:pg16
    container_name: aisc_transformed
    restart: unless-stopped
    environment:
      POSTGRES_USER: aisc_data
      POSTGRES_PASSWORD: aisc_data_local_2026
      POSTGRES_DB: aisc_data
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata_transformed:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aisc_data -d aisc_data"]
      interval: 5s
      timeout: 5s
      retries: 10
  airflow:
    build:
      context: ./data_pipeline
      dockerfile: Dockerfile.airflow

    container_name: aisc_airflow
    working_dir: /app
    restart: unless-stopped

    command:
      - bash
      - -ec
      - |
        cp /app/config/airflow_passwords.json /opt/airflow/airflow_passwords.json
        exec airflow standalone

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://aisc_data:aisc_data_local_2026@postgres_transformed:5432/airflow_meta

      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Ho_Chi_Minh
      AIRFLOW__CORE__PARALLELISM: "1"

      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/airflow_passwords.json

      SOURCE_DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/aisc_db
      TRANSFORMED_DATABASE_URL: postgresql://aisc_data:aisc_data_local_2026@postgres_transformed:5432/aisc_data

      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: aisc_admin
      AWS_SECRET_ACCESS_KEY: aisc_minio_local_2026
      AWS_DEFAULT_REGION: us-east-1
      RAW_BUCKET: aisc-raw

    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      - airflow_home:/opt/airflow
      - ./data_pipeline:/app:ro
      - ./data_pipeline/dags:/opt/airflow/dags:ro

    depends_on:
      postgres:
        condition: service_healthy
      postgres_transformed:
        condition: service_healthy
      minio:
        condition: service_started
      embedding:
        condition: service_healthy

  embedding:
    build:
      context: ./data_pipeline/embedding_service

    container_name: aisc_embedding
    restart: unless-stopped

    environment:
      HF_HUB_DISABLE_XET: "1"
      TORCH_NUM_THREADS: "2"

    ports:
      - "127.0.0.1:8001:8000"

    volumes:
      - embedding_cache:/models

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10m
volumes:
  pgdata:
  minio_data:
  pgdata_transformed:
  airflow_home:
  embedding_cache: