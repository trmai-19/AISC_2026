<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập & Đăng ký - DCI Phiên Dịch Văn Hoá Số</title>
  <meta name="description" content="Trang xác thực người dùng nền tảng DCI - Digital Cultural Interpreter">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><path d='M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20'/><path d='M2 12h20'/></svg>">
  <style>
    body {
      font-family: var(--font-family);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }
    .auth-page-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background: radial-gradient(circle at 50% 15%, rgba(37, 99, 235, 0.15), transparent 60%), var(--bg-primary);
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-surface);
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-xl);
      padding: 2.25rem 2rem;
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(12px);
    }
    .auth-tabs {
      display: flex;
      gap: 0.35rem;
      background: var(--bg-secondary);
      padding: 4px;
      border-radius: var(--radius-md);
      margin-bottom: 1.75rem;
      border: 1px solid var(--border-subtle);
    }
    .auth-tab-btn {
      flex: 1;
      padding: 0.65rem 0.5rem;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-weight: 700;
      font-size: 0.85rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition);
      font-family: inherit;
    }
    .auth-tab-btn.active {
      background: var(--accent-primary);
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(37, 99, 235, 0.35);
    }
    .form-field {
      margin-bottom: 1.1rem;
    }
    .form-field label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 0.45rem;
    }
    .custom-input, .custom-select {
      width: 100%;
      box-sizing: border-box;
      padding: 0.72rem 0.95rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.88rem;
      outline: none;
      transition: var(--transition);
    }
    .custom-input:focus, .custom-select:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
      background: var(--bg-surface);
    }
    .btn-submit-hero {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      width: 100%;
      box-sizing: border-box;
      padding: 0.85rem 1.4rem;
      background: var(--gradient-brand);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
      font-family: inherit;
      margin-top: 0.5rem;
    }
    .btn-submit-hero:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.45);
      filter: brightness(1.08);
    }
    .btn-submit-hero:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="auth-page-wrapper">
    <!-- Brand Title -->
    <div style="text-align: center; margin-bottom: 1.75rem;">
      <a href="index.html" class="brand-section" style="justify-content: center; margin-bottom: 0.5rem;">
        <div class="brand-logo-badge">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
        </div>
        <div class="brand-text">
          <span class="brand-title">DCI</span>
          <span class="brand-subtitle">Phiên dịch văn hóa số</span>
        </div>
      </a>
      <p style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 0.25rem;">Hệ thống hỗ trợ thích nghi văn hoá & quy chuẩn ứng xử đa quốc gia</p>
    </div>

    <!-- Auth Card -->
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab-btn active" id="tabBtnLogin" onclick="switchAuthTab('login')">Đăng Nhập</button>
        <button class="auth-tab-btn" id="tabBtnRegister" onclick="switchAuthTab('register')">Đăng Ký Thành Viên</button>
      </div>

      <!-- FORM 1: ĐĂNG NHẬP -->
      <form id="loginForm" onsubmit="handleLoginFormSubmit(event)">
        <div class="form-field">
          <label for="loginEmail">Địa chỉ Email</label>
          <input type="email" id="loginEmail" class="custom-input" placeholder="nhap.email@example.com" required autocomplete="email">
        </div>

        <div class="form-field">
          <label for="loginPassword">Mật khẩu</label>
          <input type="password" id="loginPassword" class="custom-input" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn-submit-hero">
          <span>Đăng nhập vào DCI</span>
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </form>

      <!-- FORM 2: ĐĂNG KÝ -->
      <form id="registerForm" style="display: none;" onsubmit="handleRegisterFormSubmit(event)">
        <div class="form-field">
          <label for="regFullName">Họ và tên</label>
          <input type="text" id="regFullName" class="custom-input" placeholder="Nguyễn Văn A" required autocomplete="name">
        </div>

        <div class="form-field">
          <label for="regEmail">Email</label>
          <input type="email" id="regEmail" class="custom-input" placeholder="email@domain.com" required autocomplete="email">
        </div>

        <div class="form-field">
          <label for="regPassword">Mật khẩu</label>
          <input type="password" id="regPassword" class="custom-input" placeholder="Tối thiểu 6 ký tự" minlength="6" required autocomplete="new-password">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
          <div class="form-field">
            <label for="regCountry">Quốc gia đến</label>
            <select id="regCountry" class="custom-select">
              <option value="JP">🇯🇵 Nhật Bản</option>
              <option value="KR">🇰🇷 Hàn Quốc</option>
              <option value="AU">🇦🇺 Australia</option>
            </select>
          </div>
          <div class="form-field">
            <label for="regPurpose">Mục đích</label>
            <select id="regPurpose" class="custom-select">
              <option value="DU_HOC">Du học sinh</option>
              <option value="LAO_DONG">Lao động kỹ năng</option>
              <option value="DINH_CU">Định cư dài hạn</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn-submit-hero">
          <span>Tạo tài khoản & Đăng nhập</span>
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </form>

      <!-- Return link -->
      <div style="text-align: center; margin-top: 1.5rem;">
        <a href="index.html" style="font-size: 0.82rem; color: var(--text-muted); text-decoration: none; transition: var(--transition);">
          ← Quay lại không gian làm việc chính (Khách vãng lai)
        </a>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <!-- Scripts -->
  <script src="data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Đồng bộ theme đã lưu từ index.html
    const savedTheme = localStorage.getItem('app-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);

    function switchAuthTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('tabBtnLogin').classList.toggle('active', isLogin);
      document.getElementById('tabBtnRegister').classList.toggle('active', !isLogin);
      document.getElementById('loginForm').style.display = isLogin ? 'block' : 'none';
      document.getElementById('registerForm').style.display = isLogin ? 'none' : 'block';
    }

    async function handleLoginFormSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      showToast('Đang xác thực...');
      const res = await loginUser(email, password);
      if (res.success) {
        showToast(`Đăng nhập thành công! Xin chào ${res.user.name}`);
        setTimeout(() => window.location.href = 'index.html', 800);
      } else {
        showToast(res.message || 'Đăng nhập không thành công.');
      }
    }

    async function handleRegisterFormSubmit(e) {
      e.preventDefault();
      const fullName = document.getElementById('regFullName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const country = document.getElementById('regCountry').value;
      const purpose = document.getElementById('regPurpose').value;

      showToast('Đang tạo tài khoản...');
      const res = await registerUser({
        full_name: fullName,
        email: email,
        password: password,
        target_country: country,
        purpose: purpose
      });

      if (res.success) {
        showToast(`Tạo tài khoản thành công! Xin chào ${res.user.name}`);
        setTimeout(() => window.location.href = 'index.html', 800);
      } else {
        showToast(res.message || 'Đăng ký thất bại.');
      }
    }
  </script>
</body>
</html>
